# Dossier spec for refract - accumulated research and audits behind the project's decisions.
kind: dossier
project: refract
subtitle: Что мы выяснили про рынок, дифференциацию и кодовую базу генератора, и на чём это основано.
updated: 2026-09-01T22:25:00+03:00
favicon: "📚"
accent: {light: "#3D49C4", dark: "#8B95F2", soft_light: "#E8EAFB", soft_dark: "#262B45"}

links:
  - {label: Статус, url: https://claude.ai/code/artifact/a5ac6d93-a36e-453a-9168-34cae528ca9e}
  - {label: Репозиторий, url: https://github.com/bim-ba/refract}

intro: >-
  Здесь лежат разборы, на которые опираются решения по refract: карта рынка, клинья
  дифференциации, разбор угрозы «агенты убьют SDK», будущие агентные стандарты, аудит кодовой
  базы и дизайн-развилки спеки. Всё собрано 30-31 августа 2026 семью исследовательскими потоками
  (~120 цитированных источников) и одним аудитом с проверками исполнением. Запись не удаляется:
  она помечается пересмотренной, устаревшей или вынесенной со ссылкой.

entries:
  - id: market
    title: Рынок SDK-генерации схлопнулся за десять месяцев
    date: 2026-08-30
    status: current
    verdict: confirmed
    thesis: >-
      Все коммерческие игроки, кроме одного, поглощены: liblab и Fern купил Postman, Stainless
      купила Anthropic и закрыла генератор для внешних. Независимым остался только Speakeasy.
      Все продавали владельцам API; сторона потребителя чужого API коммерчески не занята никем.
    sections:
      - heading: Сделки
        table:
          columns: [Игрок, Событие, Когда, Следствие]
          rows:
            - ["liblab", "куплен Postman", "2025-11", "поглощён как движок и команда"]
            - ["Fern", "куплен Postman", "2026-01", "лучшие независимые отзывы о качестве кода ушли внутрь платформы"]
            - ["Stainless", "куплен Anthropic, больше $300M", "2026-05", "хостинг генератора закрыт для всех, кроме Anthropic; клиентами были OpenAI, Google, Cloudflare, Meta"]
            - ["Speakeasy", "независим", "-", "$600-720 в месяц за язык"]
      - heading: Боль открытых генераторов
        paragraphs:
          - >-
            Самая массовая жалоба экосистемы - Kiota
            [#3911](https://github.com/microsoft/kiota/issues/3911) (299 голосов, открыта):
            генерирует всё nullable независимо от `required` в спеке. AutoRest отставлен самим
            Microsoft. openapi-python-client до сих пор на attrs вместо pydantic, и мейнтейнер
            признал, что причина выбора устарела. Ни один из шести обследованных открытых
            генераторов не генерирует MCP и не имеет механизма правок, переживающих регенерацию.
        note:
          state: bad
          text: >-
            Топ-3 задокументированные боли - это потеря типовой точности спеки на пути к коду.
            Именно её refract закрывает by design: планка - байт-эквивалентность рукописному.
    decisions:
      - {text: "Клин позиционирования: инструмент стороны потребителя API, открытый и локальный", state: done}
    sources:
      - {label: "Отчёт research-commercial (scratchpad сессии)", read_at: 2026-08-30T21:00:00+03:00}
      - {label: "Отчёт research-oss-pain (scratchpad сессии)", read_at: 2026-08-30T21:30:00+03:00}
      - {label: Kiota issue 3911, url: https://github.com/microsoft/kiota/issues/3911, read_at: 2026-08-30T21:30:00+03:00}

  - id: wedges
    title: Три клина дифференциации
    date: 2026-08-30
    status: current
    verdict: confirmed
    thesis: >-
      Реальных клина три: сторона потребителя API (длинный хвост рукописных обёрток никем не
      обслужен), spec-native курируемый MCP (у конкурентов курация - пост-хок overlay) и
      независимость с планкой «неотличимо от рукописного кода». Table stakes, которые нельзя
      провалить: механизм правок, переживающих регенерацию, и маленькие читаемые диффы.
    sections:
      - heading: Сторона потребителя
        paragraphs:
          - >-
            Все коммерческие продают владельцу API. refract - инструмент того, кто оборачивает
            чужой API: на GitHub тысячи репозиториев с топиком
            [api-wrapper](https://github.com/topics/api-wrapper). Кейс Yandex Tracker: при живом
            официальном тонком клиенте сообщество построило ещё две обёртки и неофициальный
            MCP-сервер.
      - heading: Spec-native MCP
        paragraphs:
          - >-
            Провал наивной конверсии OpenAPI в MCP признан самими вендорами: Speakeasy пишет, что
            один тул на эндпоинт ломается после ~500 операций; Stainless ушёл в code-mode. У
            refract курация - свойство спеки: операция без `mcp:`-фасета не публикуется, safety и
            описания авторские, `require_found` компилируется в гвард пустого успеха, которого
            нет ни у одного конкурента.
      - heading: Что конвертирует рукописных авторов
        paragraphs:
          - >-
            Единственный задокументированный переход команды с рукописного SDK на генератор
            (turbopuffer на Stainless) случился после появления regen-safe механизма ручных
            правок. У Fern это Replay, у Speakeasy - Custom Code Regions, у открытых генераторов
            нет ничего. Ценность для мейнтейнера - не «меньше строк», а маленькие git-диффы при
            изменении API.
        note:
          state: work
          text: Главный разрыв превращён в задачу [#18](https://github.com/bim-ba/refract/issues/18); дизайн-варианты в записи fork18 ниже.
    sources:
      - {label: "Отчёты research-commercial, research-oss-pain, research-handwritten-authors, research-mcp-wedge (scratchpad сессии)", read_at: 2026-08-30T22:00:00+03:00}
      - {label: Кейс turbopuffer, url: https://www.stainless.com/customers/turbopuffer, read_at: 2026-08-30T21:50:00+03:00}
      - {label: Уроки 50 MCP-серверов Speakeasy, url: https://www.speakeasy.com/blog/generating-mcp-from-openapi-lessons-from-50-production-servers, read_at: 2026-08-30T21:40:00+03:00}

  - id: bear
    title: Угроза «агенты убьют SDK»
    date: 2026-08-30
    status: current
    verdict: conflicted
    thesis: >-
      Тезис «агенты будут звать API напрямую, SDK не нужны» по первоисточникам не подтверждается:
      Cloudflare Code Mode и Anthropic code-execution оба генерируют типизированный интерфейс и
      пишут код против него, то есть перемещают SDK, а не устраняют. Но нейтрального бенчмарка
      нет, поэтому вердикт - расходится.
    sections:
      - heading: Что говорят первоисточники
        paragraphs:
          - >-
            [Code Mode](https://blog.cloudflare.com/code-mode-mcp/) экономит до 99.9% токенов,
            [code-execution-with-MCP](https://www.anthropic.com/engineering/code-execution-with-mcp)
            до 98.7% - оба через типизированный API, против которого агент пишет код. Бенчмарк
            Stainless (с заявленной предвзятостью) даёт factuality 33-53% у всех подходов - это
            плато, которое не закрывается размером модели.
      - heading: Что под риском и что дорожает
        table:
          columns: [Под риском, Дорожает]
          rows:
            - ["HTTP-boilerplate простых вызовов", "курация сложных и stateful операций"]
            - ["тривиальные CRUD-тесты", "детерминированная и аудируемая регенерация"]
            - ["-", "централизованный auth; подотчётность за чужую спеку в git"]
    sources:
      - {label: "Отчёт research-market-fit (scratchpad сессии)", read_at: 2026-08-30T23:00:00+03:00}
      - {label: Cloudflare Code Mode, url: https://blog.cloudflare.com/code-mode-mcp/, read_at: 2026-08-30T22:50:00+03:00}
      - {label: Anthropic code execution with MCP, url: https://www.anthropic.com/engineering/code-execution-with-mcp, read_at: 2026-08-30T22:50:00+03:00}

  - id: standards
    title: Будущие агентные стандарты и «солома» под них
    date: 2026-08-30
    status: current
    verdict: confirmed
    thesis: >-
      Транспорт тулов выиграл MCP: OpenAI принял его за пять месяцев, и за восемь месяцев MCP,
      A2A и AGENTS.md съехались под один фонд (AAIF в Linux Foundation). Открытый churn остался
      на слое workflow (Arazzo). Стратегия refract - нейтральная спека плюс эмиттер на каждый
      новый стандарт - подтверждается для смены целей, с оговоркой: сами примитивы агентного
      мира ещё пересматриваются.
    sections:
      - heading: Три понятия, которые спеке стоит отрастить
        table:
          columns: [Понятие, Потребитель, Статус]
          rows:
            - ["workflow поверх операций", "Arazzo (OpenAPI Initiative)", "не начато"]
            - ["идентичность ресурса и границы доверия", "A2A Agent Cards", "бэклог, задача #24"]
            - ["процедурный нарратив «как этим пользоваться»", "Skills / AGENTS.md", "не начато"]
        note:
          state: open
          text: >-
            llms.txt фактически мёртв (исследование на 300 тысячах доменов: ~10% и ноль эффекта),
            AgentKit-билдер OpenAI не прожил года - ставить на одиночные форматы рано.
    sources:
      - {label: "Отчёт research-agent-standards (scratchpad сессии)", read_at: 2026-08-30T23:30:00+03:00}
      - {label: Спецификация Arazzo, url: https://github.com/OAI/Arazzo-Specification, read_at: 2026-08-30T23:20:00+03:00}
      - {label: Протокол A2A, url: https://a2a-protocol.org/, read_at: 2026-08-30T23:20:00+03:00}

  - id: layering
    title: Слоёнка «SDK - ядро, поверхности - мапперы»
    date: 2026-08-30
    status: moved
    moved_to: https://github.com/bim-ba/refract/blob/main/docs/design.md
    thesis: >-
      Идея задачи #8 оказалась уже реализованной: CLI-команда - одна строка делегирования
      клиенту, MCP-тул получает клиент через DI. Тезис кодифицирован в design.md §0.6 и §0.7
      (PR #27) вместе с позицией «MCP курируется в спеке, а не конвертируется 1:1»; здесь
      остаётся только ссылка. Нереализованный остаток идеи живёт в задаче
      [#19](https://github.com/bim-ba/refract/issues/19).
    sections:
      - heading: Куда смотреть
        paragraphs:
          - >-
            design.md §0.6 «Layering: the generated SDK is the core» и §0.7 «MCP stance», оба с
            отсылками к реальному сгенерированному коду корпуса. Отклонённая альтернатива
            (рантайм-рефлексия без кодогена поверхностей) записана там же.
    sources:
      - {label: design.md, url: https://github.com/bim-ba/refract/blob/main/docs/design.md, read_at: 2026-09-01T16:30:00+03:00}

  - id: audit
    title: Аудит кодовой базы на overengineering
    date: 2026-08-30
    revised: 2026-08-31
    status: current
    verdict: confirmed
    thesis: >-
      Аудит с проверками исполнением нашёл систематическую избыточность в питоновском бэкенде и
      один настоящий баг. Безопасная часть применена в PR #37: минус 240 строк src при нуле
      изменённых байт выхода. Предложение убрать jinja2 владелец отклонил: шаблоны выбраны ради
      читаемости и правок руками.
    sections:
      - heading: Что нашли и что с этим стало
        table:
          columns: [Находка, Судьба]
          rows:
            - ["восемь классов-эмиттеров как одна копипаста", "свёрнуты в таблицу настроек (PR #37)"]
            - ["ручная переписка полей в лоадере", "заменена на from_attributes, для тест-кейсов опровергнута измерением и оставлена"]
            - ["недостижимые защитные ветки и их тесты", "удалены парами (PR #37)"]
            - ["замена jinja2 сборкой строк, байт-эквивалентная", "отклонена владельцем, зафиксировано в задаче #20"]
            - ["поля спеки dump, enum, deprecated молча игнорируются", "баг; поля удалены из схемы, спека с ними падает громко (#16)"]
      - heading: Вердикт по архитектуре
        paragraphs:
          - >-
            Слои spec, IR, эмиттеры - правильное число слоёв: IR отрабатывает своё в пяти местах
            (замкнутая сумма типов, синтез дискриминаторов и другие). Удалять надо было
            транскрипцию, а не слой - что и сделано.
    decisions:
      - {text: "jinja2 остаётся; к вопросу не возвращаемся", state: done, url: https://github.com/bim-ba/refract/issues/20}
      - {text: "Безопасный пакет применён без изменения байтов выхода", state: done, url: https://github.com/bim-ba/refract/pull/37}
    sources:
      - {label: "Отчёт simplification-audit (scratchpad сессии)", read_at: 2026-08-30T20:30:00+03:00}
      - {label: PR 37, url: https://github.com/bim-ba/refract/pull/37, read_at: 2026-09-01T23:00:00+03:00}

  - id: fork18
    title: "Дизайн-развилка #18: правки, переживающие регенерацию"
    date: 2026-08-31
    status: current
    verdict: confirmed
    thesis: >-
      Генератор перезаписывает каждый файл out/ целиком; механизма ручных правок нет ни у нас,
      ни у одного открытого генератора, и ресёрч показал, что это главный блокер перехода
      рукописных авторов. Рекомендация: вариант А - «сгенерированное не трогаем, своё в соседнем
      custom.py», с пересмотром в сторону слияния, когда первому реальному потребителю
      понадобится править строку внутри сгенерированной функции. Выбор за владельцем.
    sections:
      - heading: Пять реальных случаев «дописать своё»
        paragraphs:
          - >-
            Обойти все страницы списка (API отдаёт максимум 100 за раз); составной MCP-тул уровня
            задачи («открой issue, если такого нет»); причуда конкретного API (Yandex Tracker с
            `version` и повтором на 409); эндпоинт, который спека пока не умеет (multipart) - его
            уже закрывает `handler:`; CLI-команда-сценарий. Сегодня таких случаев в refract ноль,
            потому что ycli ещё не мигрировал на сгенерированный код - все его 32 ресурса рукописные.
      - heading: Варианты
        table:
          columns: [Вариант, Суть, Цена]
          rows:
            - ["А - своё рядом", "сгенерированные файлы только для чтения; своё в custom.py с фиксированным именем, генератор кладёт заготовку один раз; хуки extend_cli и extend_mcp", "нельзя править строку внутри сгенерированного метода, только обернуть его через super()"]
            - ["Б - защищённые области", "маркеры custom-begin и custom-end внутри сгенерированных файлов", "пустые пары маркеров во всех файлах корпуса; правки вне маркеров теряются молча; обернуть метод нельзя"]
            - ["В - трёхстороннее слияние", "снимок прошлой генерации плюс merge, как Fern Replay", "каталог состояния, конфликты требуют человека, смысл --check размывается"]
      - heading: Вариант А в коде
        paragraphs:
          - >-
            Дубликата нет: сгенерированный файл держит только сгенерированное, твой `custom.py` -
            только твоё, имя фиксированное, одно на ресурс. Генератор кладёт заготовку один раз;
            корневой клиент всегда импортирует класс из `custom.py`.
        code:
          language: python
          block: |
            # out/github/repos/custom.py - генератор создал заготовку и больше не трогает
            from .client import ReposClient as _Generated
            from .models import Issue, IssueCreate, Repo

            class ReposClient(_Generated):
                def create_issue_if_absent(self, owner: str, repo: str, title: str) -> Issue:
                    """Открой issue, если такого ещё нет - составной вызов для агента."""
                    for issue in self.issues(owner, repo, state="open").root:
                        if issue.title == title:
                            return issue
                    return self.create_issue(owner, repo, IssueCreate(title=title))

                def get(self, owner: str, repo: str) -> Repo:
                    """Обернуть сгенерированный метод целиком: повторить при 502."""
                    try:
                        return super().get(owner, repo)
                    except UpstreamError:
                        return super().get(owner, repo)
      - heading: Вариант Б в коде
        paragraphs:
          - >-
            Маркеры живут внутри сгенерированного файла; при регенерации содержимое области
            переносится в новый рендер. Правка вне маркеров теряется молча, обернуть
            сгенерированный метод нельзя - он вне области.
        code:
          language: python
          block: |
            class ReposClient(GithubResource):
                def get(self, owner: str, repo: str) -> Repo:
                    return self._session.send(_requests.get(owner, repo))

                # refract:custom-begin ReposClient.methods
                def create_issue_if_absent(self, owner: str, repo: str, title: str) -> Issue:
                    ...
                # refract:custom-end
      - heading: Вариант В в коде
        paragraphs:
          - >-
            Генератор хранит снимок прошлой генерации и сливает три версии, как git. Пока спека и
            ты меняли разные места - сливается само; одно и то же место - конфликт, его разбирает
            человек.
        code:
          block: |
            .refract/snapshot/github/repos/client.py   # что генератор выдал в прошлый раз
            out/github/repos/client.py                 # то же самое + твои правки
            <новая генерация>                          # из изменённой спеки

                def get(self, owner: str, repo: str) -> Repo:
            <<<<<<< yours
                    """One repository, retried once on 502."""
            =======
                    """GET /repos/{owner}/{repo} -> one repository (cached 60 s)."""
            >>>>>>> generated
      - heading: Сопутствующее
        note:
          state: open
          text: "Генератор никогда не удаляет файлы, выпавшие из спеки - заведена задача [#38](https://github.com/bim-ba/refract/issues/38)."
    open:
      - {text: "Выбор варианта (А / Б / В)", who: владелец, since: 2026-08-31, url: https://github.com/bim-ba/refract/issues/18}
    sources:
      - {label: "Отчёт design-facts-18-19 (scratchpad сессии)", read_at: 2026-09-01T22:00:00+03:00}
      - {label: "Задача 18", url: https://github.com/bim-ba/refract/issues/18, read_at: 2026-09-01T22:00:00+03:00}

  - id: fork19
    title: "Дизайн-развилка #19: описывать ресурс, а не каждую операцию"
    date: 2026-08-31
    status: current
    verdict: confirmed
    thesis: >-
      На девяти операциях двух корпусов HTTP-метод и класс безопасности MCP выводятся из вида
      операции в девяти случаях из девяти; всё остальное симметрию ломает (статусы 200 против
      201, слеши, вложенные коллекции, отсутствие delete в корпусе). Рекомендация: сначала
      `kind:` у операции, заголовок ресурса как в Smithy - после роста корпуса. Выбор за владельцем.
    sections:
      - heading: Как операция выглядит сегодня
        code:
          language: yaml
          block: |
            - name: get
              method: GET                # выводимо: чтение = GET
              path: repos/{owner}/{repo}
              operationId: repos_get     # выводимо: ресурс_операция
              params:
                - {name: owner, loc: path, type: string}
                - {name: repo,  loc: path, type: string}
              responses: {200: {model: Repo}}
              mcp:
                name: repos_get          # выводимо
                safety: RO               # выводимо: чтение = только читает
                title: "Get a GitHub repository"
      - heading: Та же операция с kind
        paragraphs:
          - >-
            Из `kind` выводятся метод, `operationId`, имя тула и класс безопасности; путь,
            параметры, статус и тексты остаются явными. Спека больше не может соврать - `kind:
            get` с методом POST падает при загрузке.
        code:
          language: yaml
          block: |
            - name: get
              kind: get                  # -> GET, repos_get, safety RO
              path: repos/{owner}/{repo}
              params:
                - {name: owner, loc: path, type: string}
                - {name: repo,  loc: path, type: string}
              responses: {200: {model: Repo}}
              mcp:
                title: "Get a GitHub repository"
      - heading: Варианты
        table:
          columns: [Вариант, Что даёт, Цена]
          rows:
            - ["А - kind у операции", "минус пять строк на операцию; спека не может соврать (kind get с методом POST падает); словарь для Б", "экономия скромная"]
            - ["Б - заголовок ресурса", "идентификаторы и коллекция один раз, операции выводятся", "на нынешнем корпусе почти каждая операция потребует override - шаблон подгонится под девять операций"]
            - ["В - ждать корпус", "решение на данных после 3-5 API", "пишем руками дольше"]
        note:
          state: wait
          text: "Вывод «у чтений CLI есть по умолчанию» упирается в задачу [#30](https://github.com/bim-ba/refract/issues/30): CLI-команда чтения сейчас теряет параметры."
    open:
      - {text: "Выбор варианта (А / Б / ждать)", who: владелец, since: 2026-08-31, url: https://github.com/bim-ba/refract/issues/19}
    sources:
      - {label: "Отчёт design-facts-18-19 (scratchpad сессии)", read_at: 2026-09-01T22:00:00+03:00}
      - {label: "Задача 19", url: https://github.com/bim-ba/refract/issues/19, read_at: 2026-09-01T22:00:00+03:00}

