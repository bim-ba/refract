architecture:
  - id: prism
    title: Одна спека, все поверхности
    thesis: >-
      Нейтральная YAML-спека лоурится в типизированный IR, из которого эмиттеры выпускают модели,
      sans-I/O билдеры запросов с клиентом, CLI, MCP-сервер и тесты. Клиент - ядро; CLI и MCP -
      тонкие мапперы, которые делегируют ему одной строкой. Каждая поверхность выводится из спеки,
      ни одна не переписывает транспорт.
    mermaid: |
      flowchart LR
        SPEC[Спека YAML] --> IR[Нейтральный IR]
        IR --> MODELS[models]
        IR --> CLIENT[request builders + client]
        IR --> CLI[CLI]
        IR --> MCP[MCP]
        IR --> TESTS[tests]
        CLI -.-> CLIENT
        MCP -.-> CLIENT
        classDef core fill:#E8EAFB,stroke:#3D49C4,color:#1B2130
        class CLIENT core
    legend:
      - {token: accent, label: ядро}
      - {token: muted, label: "делегирует, не переписывает"}
    decisions:
      - {text: "Клиент - ядро, CLI и MCP - тонкие мапперы, спека - единственный источник истины", state: done, url: https://github.com/bim-ba/refract/pull/27}
      - {text: "MCP курируется в спеке, а не конвертируется 1:1 из эндпоинтов", state: done, url: https://github.com/bim-ba/refract/pull/27}
      - {text: "jinja2-шаблоны остаются ради читаемости и правок руками", state: done, url: https://github.com/bim-ba/refract/issues/20}
      - {text: "Поля спеки, которые никуда не доезжают, удаляются, а не глотаются молча", state: done, url: https://github.com/bim-ba/refract/issues/16}
      - {text: "Примеры живут в репо, сгенерированное коммитится, CI падает на диффе", state: done, url: https://github.com/bim-ba/refract/issues/21}
    open:
      - {text: "Как дописывать своё, чтобы регенерация не съедала", who: владелец, since: 2026-08-31, url: https://github.com/bim-ba/refract/issues/18}
      - {text: "Описывать ресурс вместо каждой операции", who: владелец, since: 2026-08-31, url: https://github.com/bim-ba/refract/issues/19}

answers:
  - q: Идея #8 «SDK как ядро, CLI и MCP как обёртки» - что с ней?
    a: >-
      Уже так работает: сгенерированная CLI-команда - одна строка делегирования клиенту, MCP-тул
      получает клиент через DI. Записано в design.md §0.6, issue закрыт; нереализованный остаток
      (описывать ресурс, выводить операции) живёт в #19.
    state: done
  - q: Удалять ли jinja2, как предлагал аудит?
    a: >-
      Нет. Шаблоны выбраны, чтобы человек мог открыть их, прочитать и поправить или форкнуть репо и
      править только шаблоны. Остальные находки аудита (таблица эмиттеров, лоадер, мёртвые ветки)
      применены в #37 без изменения единого байта выхода.
    state: done
  - q: Где живёт корпус примеров и на каком API делать демо?
    a: >-
      В этом же репозитории с проверкой регенерации в CI, как у зрелых генераторов. Демо - на
      GitHub API как самом узнаваемом; пример добавлен (#29), гифка переснята на нём.
    state: done
  - q: Что делать с полями спеки dump, enum и deprecated, которые молча игнорировались?
    a: >-
      Удалены из схемы: спека с ними теперь громко падает. Вернутся настоящей поддержкой, когда
      появится пример, которому они нужны.
    state: done
  - q: Как дать пользователю дописывать своё, чтобы регенерация это не съедала (#18)?
    a: >-
      Три варианта с живым кодом на GitHub-ресурсе лежат в досье: своё в соседнем файле
      (рекомендация), защищённые области, трёхстороннее слияние. Решение за владельцем.
    state: wait
  - q: Поднимать ли спеку на уровень ресурса (#19)?
    a: >-
      Рекомендация: сначала `kind:` у операции (метод и safety выводятся в 9 случаях из 9 по
      корпусу), заголовок ресурса - после роста корпуса. Решение за владельцем.
    state: wait

