name: github
server:
  base_url: https://api.github.com
# GitHub also documents `Accept: application/vnd.github+json` and `X-GitHub-Api-Version`, but no
# python surface reads `default_headers` today - authoring them here would emit nothing.
default_headers: {}
auth:
  # Single templated header (`kind: header`) - GitHub documents `Authorization: Bearer <TOKEN>`
  # for a personal access token. The value is an env-var PLACEHOLDER: no credential lives here.
  token:
    kind: header
    header: Authorization
    template: "Bearer {github_token}"
    inputs:
      github_token: {env: GITHUB_TOKEN}
