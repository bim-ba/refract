# from_name renames a label in place, so every issue keeps it.

# What the owner has to do.
- name: "needs:decision"
  color: "#e99695"
  description: "Waiting for an owner decision"
- name: "needs:attention"
  color: "#0e8a16"
  description: "For the owner to read: defaults chosen, work done, risks; answer only to disagree"
- name: "needs:action"
  color: "#fbca04"
  description: "The owner has to do something outside the repository"

# When.
- name: "priority:now"
  color: "#b60205"
  description: "Do now"
- name: "priority:next"
  color: "#d93f0b"
  description: "Do after the current work"
- name: "priority:later"
  color: "#c5def5"
  description: "Later, when there is room"

# What kind of work.
- name: "type:bug"
  color: "#d73a4a"
  description: "Something isn't working"
  from_name: "bug"
- name: "type:feature"
  color: "#a2eeef"
  description: "New feature or request"
  from_name: "enhancement"
- name: "type:debt"
  color: "#d4c5f9"
  description: "Restructure or pay back debt without behaviour change"
- name: "type:security"
  color: "#b60205"
  description: "Secrets, credentials, personal data, release access"
- name: "type:docs"
  color: "#0075ca"
  description: "Improvements or additions to documentation"
  from_name: "documentation"
- name: "type:research"
  color: "#1d76db"
  description: "An investigation whose result is a finding"

# Which part of refract.
- name: "scope:spec"
  color: "#1d76db"
  description: "Loading and validating the YAML spec"
- name: "scope:ir"
  color: "#5319e7"
  description: "The typed intermediate representation"
- name: "scope:emitters"
  color: "#0e8a16"
  description: "Backends that write code for a language"
- name: "scope:runtime"
  color: "#fbca04"
  description: "What generated code imports at run time"
- name: "scope:cli"
  color: "#f9d0c4"
  description: "The refract command"
- name: "scope:ci"
  color: "#c5def5"
  description: "CI/CD and release automation"

# A wayfinder map and its decision tickets.
- name: "wayfinder:map"
  color: "#0e8a16"
  description: "Wayfinder map: the route to one destination"
- name: "wayfinder:research"
  color: "#1d76db"
  description: "Wayfinder ticket: a fact a decision waits on"
- name: "wayfinder:grilling"
  color: "#d93f0b"
  description: "Wayfinder ticket: a decision settled in conversation with the owner"
- name: "wayfinder:prototype"
  color: "#5319e7"
  description: "Wayfinder ticket: a rough artefact to react to"
- name: "wayfinder:task"
  color: "#fbca04"
  description: "Wayfinder ticket: work that unblocks a decision"

# Kept as they are: release-please writes the autorelease labels.
- name: "autorelease: pending"
  color: "#ededed"
- name: "autorelease: tagged"
  color: "#ededed"
- name: "duplicate"
  color: "#cfd3d7"
  description: "This issue or pull request already exists"
- name: "good first issue"
  color: "#7057ff"
  description: "Good for newcomers"
- name: "help wanted"
  color: "#008672"
  description: "Extra attention is needed"
- name: "invalid"
  color: "#e4e669"
  description: "This doesn't seem right"
- name: "question"
  color: "#d876e3"
  description: "Further information is requested"
- name: "wontfix"
  color: "#ffffff"
  description: "This will not be worked on"
